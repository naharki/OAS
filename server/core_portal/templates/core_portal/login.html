<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>डिजिटल कार्यालय प्रणाली | Sign In</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --input-bg: rgba(15, 23, 42, 0.6);
      --input-border: rgba(255, 255, 255, 0.1);
      --focus-color: #6366f1;
    }
    
    body {
      background: var(--bg-gradient);
      font-family: 'Outfit', sans-serif;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .login-container {
      width: 100%;
      max-width: 450px;
    }

    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #4f46e5, #a855f7, #ec4899);
    }

    .form-label {
      font-size: 0.875rem;
      font-weight: 500;
      color: #cbd5e1;
      margin-bottom: 0.5rem;
    }

    .form-control {
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      color: #ffffff;
      padding: 0.75rem 1rem;
      transition: all 0.2s ease;
    }

    .form-control:focus {
      background: rgba(15, 23, 42, 0.8);
      border-color: var(--focus-color);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
      color: #ffffff;
    }

    .form-control::placeholder {
      color: #64748b;
    }

    .btn-login {
      background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      padding: 0.8rem;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
      transition: all 0.2s ease;
    }

    .btn-login:hover {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.4);
      transform: translateY(-1px);
    }

    .brand-logo {
      width: 52px;
      height: 52px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      color: #818cf8;
    }

    .alert-custom {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #f87171;
      border-radius: 12px;
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
    }

    .size-6 { width: 24px; height: 24px; }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="brand-logo">
        <i data-lucide="shield-check" class="size-6"></i>
      </div>
      
      <h3 class="text-center fw-bold text-white mb-2">Sign In to Platform</h3>
      <p class="text-center text-muted small mb-4">Enter credentials to access assigned workspace apps.</p>

      {% if messages %}
        {% for message in messages %}
          {% if message.tags == 'error' %}
            <div class="alert-custom d-flex align-items-center gap-2">
              <i data-lucide="alert-circle" style="flex-shrink:0;" class="size-4"></i>
              <div>{{ message }}</div>
            </div>
          {% endif %}
        {% endfor %}
      {% endif %}

      <form method="post" action="{% url 'login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
        {% csrf_token %}
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" class="form-control text-white" id="username" name="username" placeholder="Enter username" required autocomplete="username">
        </div>
        
        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control text-white" id="password" name="password" placeholder="Enter password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-login w-100 d-flex align-items-center justify-content-center gap-2">
          <span>Authorize Access</span>
          <i data-lucide="arrow-right" class="size-4"></i>
        </button>
      </form>

      <div class="mt-4 pt-3 border-top border-white border-opacity-5 text-center">
        <a href="{% url 'launchpad' %}" class="text-indigo-400 small text-decoration-none d-inline-flex align-items-center gap-1">
          <i data-lucide="arrow-left" class="size-4"></i>
          Back to Launchpad
        </a>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
