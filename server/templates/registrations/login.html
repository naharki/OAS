{% extends "base.html" %}

{% block content %}
<div style="width: 300px; margin: 100px auto;">
    <h2>Login</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Login</button>
    </form>

    {% if form.errors %}
        <p style="color:red;">Invalid username or password</p>
    {% endif %}
</div>
{% endblock %}
